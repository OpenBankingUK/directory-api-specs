  schemas:
    AuthorisationSchema:
      type: object
      properties:
        Active:
          type: boolean
        MemberState:
          type: string
          description: Member state. This field is searchable.
          enum:
          - AT
          - BE
          - BG
          - CY
          - CZ
          - DE
          - DK
          - EE
          - EL
          - ES
          - FI
          - FR
          - GB
          - GG
          - GI
          - GR
          - HR
          - HU
          - IE
          - IM
          - IS
          - IT
          - JE
          - LI
          - LT
          - LU
          - LV
          - MT
          - NL
          - 'NO'
          - PL
          - PT
          - RO
          - SE
          - SI
          - SK
        Psd2Role:
          type: string
          enum:
          - ASPSP
          - AISP
          - PISP
          - CBPII
          description: |
            Psd2 Role in which institution authorised. This field is searchable.
              * `AISP` - Account Information Service Provider
              * `ASPSP` - Account Servicing Payment Service Provider
              * `CBPII` - Card-Based Payment Instrument Issuer
              * `PISP` - Payment Initiation Service Provider
      required:
      - Active
      - MemberState
      - Psd2Role
    AuthorisationAuthoritySchema:
      type: object
      properties:
        AuthorityId:
          type: string
          maxLength: 255
          description: Authority identifier. This field is searchable.
        AuthorizationDomain:
          type: string
          enum:
          - PSD2
          - Pay.UK
          - CD
          description: Authorisation Domain. This field is searchable.
        MemberState:
          type: string
          description: Member state. This field is searchable.
          enum:
          - AT
          - BE
          - BG
          - CY
          - CZ
          - DE
          - DK
          - EE
          - EL
          - ES
          - FI
          - FR
          - GB
          - GG
          - GI
          - GR
          - HR
          - HU
          - IE
          - IM
          - IS
          - IT
          - JE
          - LI
          - LT
          - LU
          - LV
          - MT
          - NL
          - 'NO'
          - PL
          - PT
          - RO
          - SE
          - SI
          - SK
        RegistrationId:
          type: string
          maxLength: 255
          description: Registration Id with the principle authority. This field is searchable.
        X509OrganisationIdentifier:
          type: array
          items:
            type: string
            maxLength: 255
      required:
      - AuthorityId
      - RegistrationId
      - X509OrganisationIdentifier
    AuthorisationDomainStatusSchema:
      type: object
      properties:
        AuthorizationDomain:
          type: string
          enum:
          - PSD2
          - Pay.UK
          - CD
          description: Authorisation Domain. This field is searchable.
        Status:
          type: string
          enum:
          - Active
          - Withdrawn
          - Revoked
          - Requested
          - Rejected
          description: |
            Indicates whether authorisation domain is active. This field is searchable. * `Active` - participant can take actions in ecosystem in authorisation domains that he is assigned to. * `Withdrawn` - revocation initiated by participants * `Revoked` - participant can't take actions in ecosystem because of privileges loss * `Requested` - set after dynamic client registration, to be confirmed by CRM * `Rejected` - dynamic client registration rejected
    AuthorisationDomainStatusRootSchema:
      type: object
      properties:
        Status:
          description: Status of an organisation in a particular authorisation domain.
          type: array
          items:
            $ref: '#/components/schemas/AuthorisationDomainStatusSchema'
    AuthorisationV11Schema:
      type: object
      properties:
        Active:
          type: boolean
        AuthorityId:
          type: string
          maxLength: 255
          description: Authority identifier. This field is searchable.
        AuthorizationDomain:
          type: string
          description: Authorisation Domain for which the authorisation server is created.
          enum:
          - PSD2
          - Pay.UK
          - CD
        MemberState:
          type: string
          description: Member state. This field is searchable.
          enum:
          - AT
          - BE
          - BG
          - CY
          - CZ
          - DE
          - DK
          - EE
          - EL
          - ES
          - FI
          - FR
          - GB
          - GG
          - GI
          - GR
          - HR
          - HU
          - IE
          - IM
          - IS
          - IT
          - JE
          - LI
          - LT
          - LU
          - LV
          - MT
          - NL
          - 'NO'
          - PL
          - PT
          - RO
          - SE
          - SI
          - SK
        Role:
          type: string
          enum:
          - AISP
          - ASPSP
          - CBPII
          - PISP
          - CD_AISP
          - CD_ASPSP
          - CD_CBPII
          description: |
            Roles for which this software statement can be used. It contains roles from one domain only. If list of roles contains ASPSP role, then any other role cannot be present. This field is searchable. Meaning of values:
              * `AISP` - Account Information Service Provider
              * `ASPSP` - Account Servicing Payment Service Provider
              * `CBPII` - Card-Based Payment Instrument Issuer
              * `PISP` - Payment Initiation Service Provider
              * `CD_AISP` - Crown Dependencies Account Information Service Provider
              * `CD_ASPSP` - Crown Dependencies Account Servicing Payment Service Provider
              * `CD_CBPII` - Crown Dependencies Card-Based Payment Instrument Issuer
    CertificateValidationResponseSchemaV2.1:
      type: object
      properties:
        data:
          type: object
          properties:
            certificate:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - obwac
                  - obseal
                  - qwac
                  - qseal
                  - obsigning
                  - obtransport
                eidas_profile:
                  type: string
                qtsp_name:
                  type: string
                qtsp_uri:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                    enum:
                    - AISP
                    - ASPSP
                    - CBPII
                    - PISP
                    - CD_AISP
                    - CD_ASPSP
                    - CD_CBPII
                    description: |
                      Meaning of values:
                        * `AISP` - Account Information Service Provider
                        * `ASPSP` - Account Servicing Payment Service Provider
                        * `CBPII` - Card-Based Payment Instrument Issuer
                        * `PISP` - Payment Initiation Service Provider
                        * `CD_AISP` - Crown Dependencies Account Information Service Provider
                        * `CD_ASPSP` - Crown Dependencies Account Servicing Payment Service Provider
                        * `CD_CBPII` - Crown Dependencies Card-Based Payment Instrument Issuer
                valid_eidas_certificate:
                  type: boolean
                valid_obietf_certificate:
                  type: boolean
                expired:
                  type: boolean
                revoked:
                  type: boolean
                check_failed:
                  type: boolean
              required:
              - type
              - eidas_profile
              - qtsp_name
              - qtsp_uri
              - roles
              - valid_eidas_certificate
              - valid_obietf_certificate
              - expired
              - revoked
              - check_failed
            organisation:
              type: object
              properties:
                onboarded_to_open_banking:
                  type: boolean
                org_name:
                  type: string
                  nullable: true
                  maxLength: 255
                passports:
                  type: object
                  properties:
                    nca_name:
                      type: object
                      properties:
                        permission_country:
                          type: array
                          items:
                            type: object
                            properties:
                              permission_type:
                                type: string
                              permissions:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    code:
                                      type: string
                                    permission:
                                      type: string
                              roles:
                                type: array
                                items:
                                  type: string
                        roles:
                          type: array
                          items:
                            type: string
                competent_authority_claims:
                  type: array
                  nullable: true
                  items:
                    type: object
                    properties:
                      authorisation_domain:
                        type: string
                        description: Authorisation Domain for which the authorisation server is created.
                        enum:
                        - PSD2
                        - Pay.UK
                        - CD
                      authority_id:
                        type: string
                        maxLength: 255
                      registration_id:
                        type: string
                        maxLength: 255
                      status:
                        type: string
                        enum:
                        - Active
                        - Withdrawn
                        - Revoked
                        - Requested
                        - Rejected
                        description: |
                          * `Active` - participant can take actions in ecosystem in authorisation domains that he is assigned to. * `Withdrawn` - revocation initiated by participants * `Revoked` - participant can't take actions in ecosystem because of privileges loss * `Requested` - set after dynamic client registration, to be confirmed by CRM * `Rejected` - dynamic client registration rejected
                      authorisations:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuthorisationSchema'
                software_statements:
                  type: array
                  nullable: true
                  items:
                    type: object
                    properties:
                      software_id:
                        type: string
                        maxLength: 22
              required:
              - onboarded_to_open_banking
              - org_name
              - passports
              - competent_authority_claims
              - software_statements
    AuthorisationServerSchema:
      type: object
      properties:
        Id:
          type: string
          maxLength: 22
          description: Authorisation Server Id V39 required. This field is searchable.
        AuthorizationDomain:
          type: string
          description: Authorisation Domain for which the authorisation server is created.This field is searchable.
          enum:
          - PSD2
          - Pay.UK
          - CD
        AutoRegistrationSupported:
          type: boolean
          description: Authorisation Server supports auto-registration. This field is searchable.
        BaseApiDNSUri:
          description: Points to the Open Banking APIs V39 required. This field is searchable.
          type: string
          format: uri
          maxLength: 2083
        CustomerFriendlyDescription:
          type: string
          maxLength: 255
          description: Customer orientated description. This field is searchable and is not included as part of
            the response payload when unassigned.
        CustomerFriendlyLogoUri:
          description: uri from which a TPP can retrieve a certified logo V39 required. This field is searchable.
          type: string
          format: uri
          maxLength: 2083
        CustomerFriendlyName:
          type: string
          maxLength: 255
          description: Certified name. This field is searchable and is not included as part of the response payload
            when unassigned.
        DeveloperPortalUri:
          description: URI for TPP developer testing V39 required. This field is searchable.
          type: string
          format: uri
          maxLength: 2083
        TermsOfService:
          description: Uri from which the terms of service can be retrieved V39 required. This field is searchable.
          type: string
          format: uri
          maxLength: 2083
        OpenIDConfigEndPointUri:
          description: Uri used for Oauth2.0 OpenId Configuration V39 required. This field is searchable.
          type: string
          format: uri
          maxLength: 2083
        PayloadSigningCertLocation:
          description: The location which is used for signing certificates V39 required. This field is searchable.
          type: string
          format: uri
          maxLength: 2083
        EISCDId:
          type: array
          items:
            type: string
            description: 'Allowed lengths: 4, 6, 14. This field is searchable and is not included as part of the
              response payload when unassigned.'
        ParentAuthorisationServerId:
          type: string
          maxLength: 2083
          description: Authorisation Server Id of Parent Authorisation server, used for app to app linking. This
            field is searchable and is not included as part of the response payload when unassigned.
        ApiResourceDiscoveryEndpoint:
          description: An RFC-3986-compliant URI. This field is searchable and is not included as part of the response
            payload when unassigned.
          type: string
          format: uri
          maxLength: 2083
      required:
      - Id
      - AutoRegistrationSupported
      - BaseApiDNSUri
      - CustomerFriendlyLogoUri
      - DeveloperPortalUri
      - TermsOfService
      - OpenIDConfigEndPointUri
      - PayloadSigningCertLocation
      - EISCDId
      - CustomerFriendlyName
      - CustomerFriendlyDescription
