            * `Suspended` - revocation initiated by the participant
            * `Revoked` - participant is no longer in the MLA scheme and cannot take actions in the ecosystem because of privilege loss
        MLAStatusUpdated:
          type: string
          format: date-time
          description: YYYY-MM-DDTHH:mm:ss.sssZ
      required:
      - OBOrganisationId
      - OrganisationCommonName
      - NCAId
      - MLAStatus
      - MLAStatusUpdated
    FapiInteractionIdSchema:
      type: string
      description: An RFC 4122 UUID used to correlate a request with its response and with server-side logs. Quote
        it to the Support Desk if you need help with a request that did not behave as you expected.
  securitySchemes:
    RaidiamAuth:
      type: openIdConnect
      description: |
        Certificate-bound OAuth 2.0 access tokens issued by Raidiam Auth using the `client_credentials` grant.

        **Discover the token endpoint** from the OpenID provider metadata rather than hardcoding it:

        * Production: `https://auth.directory.openbanking.org.uk/.well-known/openid-configuration`
        * Sandbox: `https://auth.sandbox.directory.openbanking.org.uk/.well-known/openid-configuration`

        The token request itself is made over mTLS against the `matls-auth.<zone>` host advertised in that metadata.

        All tokens are certificate-bound per RFC 8705: the token's `cnf.x5t#S256` claim carries the SHA-256 thumbprint of the mTLS client certificate presented at the token endpoint, and the presented certificate is compared to that thumbprint on every API call.

        **Scopes are Raidiam-native.** Legacy OBL scope names (`ASPSPReadAccess`, `TPPReadAccess`, `TPPManage`, `ASPSPManage`, `JWKSManage`, and so on) are not issued at this token endpoint; request the native scope shown on each operation. The two legacy-style names that remain (`NCAReadAccess`, `MLAReadAccess`) are real Raidiam Auth scopes granted through directory role assignment.

        Scopes used by this API:

        * `directory:software` - read access across the directory surface
        * `directory:software:cert:management` - manage certificates and keys held against a software statement
        * `directory:software:organisation:cert:management` - manage certificates and keys held against an organisation, including revocation
        * `directory:software:organisation:application:management` - create a software statement; creation only, not update
        * `NCAReadAccess` - retrieve NCAs and their firms' authorisation details; granted via the *NCA Read* directory role
        * `MLAReadAccess` - retrieve MLA status; granted via the *MLA Read* directory role
      openIdConnectUrl: https://auth.directory.openbanking.org.uk/.well-known/openid-configuration
