openapi: 3.0.0
info:
  title: OBL Directory API (Raidiam Connect)
  version: 2.2.0
  description: |
    The OBL Directory API as served by Raidiam Connect.

    This specification is the participant-facing contract for the OBL v2.2 compatibility
    surface and the legacy-contract ancillary services that sit alongside it. It is derived
    from OBL's published Directory API and NCA API specifications and describes **only what
    Raidiam Connect actually serves**. If an operation is absent here, it is not served.

    ## What changes for you

    Three things change, and **all three affect every consumer**.

    1. **Path prefix - `/v2.1/` becomes `/v2.2/`.** Every retained directory operation moves
       to a `/v2.2` prefix. The operations themselves are unchanged: same path structure below
       the prefix, same path and query parameters, same request bodies, same response bodies,
       same content negotiation. Only the version segment moves.

       ```
       before  https://matls-dirapi.openbanking.org.uk/v2.1/organisation/{OrganisationId}
       after   https://matls-oblapi.directory.openbanking.org.uk/v2.2/organisation/{OrganisationId}
       ```

       **This does not apply to the NCA API**, which keeps its `/api/v2/nca` paths - see below.

    2. **Hostname.** `matls-dirapi.openbanking.org.uk` becomes
       `matls-oblapi.directory.openbanking.org.uk` (and the sandbox equivalent). The NCA API
       moves onto the same host from its own legacy hostname.

    3. **Token issuer and scope names.** Tokens come from Raidiam Auth and carry
       Raidiam-native scopes. Discover the token endpoint from the OpenID provider metadata;
       see the `RaidiamAuth` security scheme for the scope catalogue.

    What does **not** change: request shapes, response bodies, status codes, content
    negotiation, and identifiers. Organisation IDs, software statement IDs and client IDs are
    preserved, so records are the same records under the same IDs. There is also **no
    trust-anchor change** - the server certificate on these hosts is issued by the same CA as
    the legacy directory's.

    So a consumer's change is mechanical in every case: repoint the host, repoint the token
    issuer, request native scopes, and change `/v2.1/` to `/v2.2/` in its base path. No
    response parsing or request construction should need touching.

    ### Which prefix applies where

    | Surface | Legacy path | Path on Raidiam Connect |
    | --- | --- | --- |
    | Directory operations | `/v2.1/...` | `/v2.2/...` |
    | Certificate validation (CVS) | `/v2.1/certificate/validate` | `/v2.2/certificate/validate` |
    | MLA status | `/v2.1/organisation/mlastatus` | `/v2.2/organisation/mlastatus` |
    | NCA API | `/api/v2/nca...` | `/api/v2/nca...` (**unchanged**) |

    ## Hosts

    | Environment | Base URL |
    | --- | --- |
    | Production | `https://matls-oblapi.directory.openbanking.org.uk` |
    | Sandbox | `https://matls-oblapi.sandbox.directory.openbanking.org.uk` |

    All endpoints require mutual TLS. Present the participant transport certificate used to
    obtain the access token; tokens are certificate-bound and a token replayed over a
    different certificate is rejected.

    ## Scope mapping from the legacy contract

    Enforcement happens at this layer: the legacy scope a given endpoint required is mapped
    to the native scope enforced on the presented token. The native APIs never see legacy
    scope names.

    | Legacy OBL scope | Raidiam scope |
    | --- | --- |
    | `ASPSPReadAccess` | `directory:software` |
    | `TPPReadAccess` | `directory:software` |
    | `TPPReadAll` | `directory:software` |
    | `AuthoritiesReadAccess` | `directory:software` |
    | `QTSPReadAccess` | `directory:software` |
    | `TPPManage` (software statement creation) | `directory:software:organisation:application:management` |
    | `TPPManage` (otherwise) | `directory:software` |
    | `ASPSPManage` | `directory:software` |
    | `JWKSManage` | `directory:software:cert:management` (software statement) or `directory:software:organisation:cert:management` (organisation) |
    | `NCAReadAccess` | `NCAReadAccess` (unchanged; granted via the *NCA Read* directory role) |
    | `MLAReadAccess` | `MLAReadAccess` (unchanged; granted via the *MLA Read* directory role) |

    `directory:software` is sufficient to create a certificate under a software statement.
    Revoking a certificate requires the corresponding management scope.

    `directory:software:organisation:application:management` confers creation of a software
    statement and nothing further. Updating one falls under `directory:software`, and only for
    a client belonging to the software statement being updated; the legacy specification
    defines no delete.

    ## Content negotiation

    Some endpoints negotiate strictly on vendor media types - for example
    `application/vnd.openbanking.directory.orgcontacts-v2+json` for contacts and
    `application/jwk-set+json` for certificates - and reject a bare wildcard `Accept`. This
    behaviour is retained, so send the same `Accept` header you send today.

    **One request media type is dropped.** `POST /v2.2/organisation/{OrganisationId}/certificate/{OrganisationCertificateType}`
    accepted either `application/x-pem-file` or `application/jwt` on the legacy directory, the
    latter carrying the CSR in a `csr` claim or the certificate chain in an `x5c` claim. Only
    `application/x-pem-file` is accepted here; a request presenting `Content-Type:
    application/jwt` is rejected. A consumer submitting certificates or CSRs as signed JWTs
    must switch to a PEM body. This is the one change on these endpoints that is not purely
    the hostname, token issuer and path prefix, so it is worth checking for specifically.

    ## Non-participant-facing hosts

    Not everything in the deployment is on this host. For reference:

    * **Native Raidiam Connect APIs** - `matls-api.<zone>`. A net-new surface; no legacy
      endpoint moves onto it. See the Raidiam Connect API reference for its inventory. The
      legacy SCIM `OBAuthorities` resource type is not reproduced anywhere on the
      compatibility layer; its consumers move to `GET /references/authorities` here, reading
      `AuthorityCode` rather than `AuthorityId`.
    * **JWKS and keystore** - `keystore.directory.openbanking.org.uk`. The legacy OBL
      keystore URLs remain in service permanently and are kept current, so issued SSAs
      continue to carry them.
    * **Open-data participant register** - `data.directory.openbanking.org.uk`. Public,
      unauthenticated, static. New in kind rather than a replacement for anything.
servers:
- url: https://matls-oblapi.directory.openbanking.org.uk
  description: Production
- url: https://matls-oblapi.sandbox.directory.openbanking.org.uk
  description: Sandbox
tags:
- name: Organisations v2.2
  description: OBL v2.2 compatibility surface - organisation reads.
- name: Contacts v2.2
  description: OBL v2.2 compatibility surface - contact reads.
- name: Software Statements v2.2
  description: OBL v2.2 compatibility surface - software statement reads.
- name: Software Statement Assertions v2.2
  description: OBL v2.2 compatibility surface - SSA retrieval.
- name: Software Statement Redirect URIs v2.2
  description: OBL v2.2 compatibility surface - redirect URI registration against a software statement.
- name: Organisation Certificates v2.2
  description: OBL v2.2 compatibility surface - organisation-level certificate and key management.
- name: Software Statement Certificates v2.2
  description: OBL v2.2 compatibility surface - software-statement-level certificate and key management.
- name: Certificate Associations v2.2
  description: OBL v2.2 compatibility surface - associating certificates with software statements.
- name: Authorisation Servers v2.2
  description: OBL v2.2 compatibility surface - authorisation server reads.
- name: Certificate Validation v2.2
  description: Certificate Validation Service. A like-for-like rebuild of the legacy CVS, same request and response
    contract.
- name: NCA API
  description: National Competent Authority register lookup. Legacy paths, request shapes and response structures
    retained unchanged, on a new hostname. **FCA data only** in this deployment.
- name: MLA Status API
  description: Multilateral Agreement status lookup. Legacy path and response structure retained unchanged, on a
    new hostname.
paths:
  /v2.2/organisation:
    parameters:
    - $ref: '#/components/parameters/FapiInteractionId'
    get:
      summary: Get all organisations that the client is authorised to retrieve
      description: |-
        Returns every organisation the client is authorised to retrieve.

        **Response size.** This endpoint returns the full ecosystem in a single document and is not paginated, matching the behaviour of the legacy endpoint today. Consumers should continue to expect the complete set in one response. Clients are encouraged to send `Accept-Encoding: gzip`.
      tags:
      - Organisations v2.2
      security:
      - RaidiamAuth:
        - directory:software
      responses:
        '200':
          $ref: '#/components/responses/OrganisationsGetFromSCIM200OKResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/403ForbiddenResponse'
        '404':
          $ref: '#/components/responses/404NotFoundResponse'
        '406':
          $ref: '#/components/responses/406NotAcceptableResponse'
  /v2.2/organisation/{OrganisationId}:
    parameters:
    - $ref: '#/components/parameters/FapiInteractionId'
    get:
      summary: Get the given organisation's details
      tags:
      - Organisations v2.2
      parameters:
      - $ref: '#/components/parameters/OrganisationId'
      security:
      - RaidiamAuth:
        - directory:software
      responses:
        '200':
          $ref: '#/components/responses/OrganisationGetFromSCIM200OKResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/403ForbiddenResponse'
        '404':
          $ref: '#/components/responses/404NotFoundResponse'
        '406':
          $ref: '#/components/responses/406NotAcceptableResponse'
  /v2.2/organisation/{OrganisationId}/contact/{ContactType}:
    parameters:
    - $ref: '#/components/parameters/FapiInteractionId'
    get:
      summary: Get the business or the technical contacts for the given organisation
      tags:
      - Contacts v2.2
      parameters:
      - $ref: '#/components/parameters/OrganisationId'
      - $ref: '#/components/parameters/ContactType'
      security:
      - RaidiamAuth:
        - directory:software
      responses:
        '200':
          $ref: '#/components/responses/Contact200OKResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '406':
          $ref: '#/components/responses/406NotAcceptableResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
  /v2.2/organisation/{OrganisationId}/software-statement:
    parameters:
    - $ref: '#/components/parameters/OrganisationId'
    - $ref: '#/components/parameters/FapiInteractionId'
    post:
      summary: Create a software statement
      description: '**Creation only.** This scope confers creation of a software statement and nothing further.
        Updating an existing software statement is served separately, under `directory:software` and only to a client
        belonging to that software statement; the legacy specification defines no delete.'
      tags:
      - Software Statements v2.2
      security:
      - RaidiamAuth:
        - directory:software:organisation:application:management
      requestBody:
        $ref: '#/components/requestBodies/SoftwareStatement'
      responses:
        '201':
          $ref: '#/components/responses/SoftwareStatement201CreatedResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '406':
          $ref: '#/components/responses/406NotAcceptableResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
    get:
      summary: Get all software statements for the given organisation
      tags:
      - Software Statements v2.2
      security:
      - RaidiamAuth:
        - directory:software
      responses:
        '200':
          $ref: '#/components/responses/SoftwareStatementsGet200OKResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '406':
          $ref: '#/components/responses/406NotAcceptableResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
  /v2.2/organisation/{OrganisationId}/software-statement/{SoftwareStatementId}:
    parameters:
    - $ref: '#/components/parameters/OrganisationId'
    - $ref: '#/components/parameters/SoftwareStatementId'
    - $ref: '#/components/parameters/FapiInteractionId'
    get:
      summary: Get a software statement
      tags:
      - Software Statements v2.2
      security:
      - RaidiamAuth:
        - directory:software
      responses:
        '200':
          $ref: '#/components/responses/SoftwareStatement201CreatedResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/404NotFoundResponse'
        '406':
          $ref: '#/components/responses/406NotAcceptableResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
    put:
      summary: Activate or deactive a software statement
      description: '**A software statement may only be updated by itself.** The calling client must belong to the
        software statement identified by `SoftwareStatementId`, presenting its own credentials. A client belonging
        to a *different* software statement of the same organisation cannot update it, and this includes a client
        holding `directory:software:organisation:application:management` - that scope confers creation of a software
        statement and nothing further. Updates are also available interactively in the Raidiam Connect WebUI.'
      tags:
      - Software Statements v2.2
      requestBody:
        $ref: '#/components/requestBodies/SoftwareStatementState'
      security:
      - RaidiamAuth:
        - directory:software
      responses:
        '200':
          $ref: '#/components/responses/SoftwareStatementUpdated200OKResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '404':
          $ref: '#/components/responses/404NotFoundResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '406':
          $ref: '#/components/responses/406NotAcceptableResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
  /v2.2/organisation/{OrganisationId}/software-statement/{SoftwareStatementId}/redirect-uri:
    parameters:
    - $ref: '#/components/parameters/OrganisationId'
    - $ref: '#/components/parameters/SoftwareStatementId'
    - $ref: '#/components/parameters/FapiInteractionId'
    post:
      summary: Add a redirect URI to the given Software Statement
      description: '**Only the software statement itself may add a redirect URI.** The calling client must belong
        to the software statement identified by `SoftwareStatementId`, presenting its own credentials, exactly as
        for updating the software statement. A client belonging to a *different* software statement of the same
        organisation cannot add one, and neither can one holding `directory:software:organisation:application:management`.
        Redirect URIs are also carried on the software statement itself, so they can equally be maintained through
        `PUT` on it; this endpoint is retained so that existing integrations registering redirect URIs individually
        keep working.'
      tags:
      - Software Statement Redirect URIs v2.2
      requestBody:
        $ref: '#/components/requestBodies/SoftwareStatementRedirectURI'
      security:
      - RaidiamAuth:
        - directory:software
      responses:
        '200':
          $ref: '#/components/responses/SoftwareStatementUpdated200OKResponse'
        '400':
          $ref: '#/components/responses/400BadRequestResponse'
        '401':
          $ref: '#/components/responses/401UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/404NotFoundResponse'
        '406':
          $ref: '#/components/responses/406NotAcceptableResponse'
        '409':
          $ref: '#/components/responses/409ConflictResponse'
        '500':
          $ref: '#/components/responses/500InternalServerErrorResponse'
        '502':
          $ref: '#/components/responses/502BadGatewayResponse'
  /v2.2/organisation/{OrganisationId}/software-statement/{SoftwareStatementId}/software-statement-assertion:
    parameters:
    - $ref: '#/components/parameters/OrganisationId'
    - $ref: '#/components/parameters/SoftwareStatementId'
    - $ref: '#/components/parameters/FapiInteractionId'
    get:
      summary: Retrieve the software statement assertion for the given SoftwareStatementID.
      description: |-
        # Depending on the type of participant, one of the following pre-conditions must be met in order to generate an SSA:
         * EU TPPs NOT on the TPR  must hold at least one eIDAS certificate.
         * EU TPPs on the TPR must hold at least one eIDAS or OB certiticate.
         * UK TPPs on the TPR must hold at least one OB certificate.
        The response body is a signed JWT and the values found in the header and the payload of the SSA are specified below
        # Terminology
          This specification uses the terms "access token", "authorization code", "authorization endpoint", "authorization grant", "authorization server", "client", "client identifier", "client secret", "grant type", "protected resource", "redirection URI", "refresh token", "resource owner", "resource server", "response type", and "token endpoint" defined by OAuth 2.0 [RFC6749] and uses the term "Claim" defined by JSON Web Token (JWT) [RFC7519].
          * __Account Servicing Payment Services Provider (ASPSP)__ -- An organisation managing customer accounts (and operating banking APIs).
          * __Primary Technical Contact__ -- The person at the TPP who creates an SSA and invokes a registration mechanism. This is an example of an [RFC7591] Client Developer.
          * __OB Organisation ID__ -- The unique identifier for each OpenBanking participant. Both TPPs and ASPSPs have OB Organisation IDs.
          * __OpenBanking Directory__ -- An implementation of a [PSD2] competent authority; acts as an Identity Provider, certificate authority, and registry governing the participants in the UK OpenBanking API scheme.
          * __ASPSP Registration Endpoint__ -- OAuth 2.0 & [RFC7591] compliant endpoint, exact value is discoverable from the [OIDCD] openid-configuration file of the ASPSP.
          * __Software Statement Assertion (SSA)__ -- An implementation of an [RFC7591] software statement, signed by the OpenBanking Directory.
          * __Trusted Third Party (TPP)__ -- An organization working to initiate payments or consume account information with/from an ASPSP.
          * __TPP Client Software__ -- software implementing an OAuth2 client, interacting with an ASPSP registration endpoint.
        # Software Statement Assertion (SSA)
          The SSA is a JSON Web Token (JWT) containing client metadata about an instance of TPP client software. The JWT is issued and signed by the OpenBanking Directory.
        ## SSA Payload
          The payload of an OpenBanking SSA MUST be a compliant software statement according to [RFC7591]. The SSA MUST also be a compliant JWT according to [RFC7519]. The following metadata profiles the metadata in [RFC7591] and [RFC7519]:
          | Metadata | Description | Source Specification |
          |----------|-------------|----------------------|
          |`software_id`|Unique Identifier for TPP Client Software|[RFC7591]|
          |`iss`|SSA Issuer|[RFC7519]|
          |`iat`|Time SSA issued|[RFC7519]|
          |`jti`|JWT ID|[RFC7519]|
          The following software metadata is additionally defined for this profile:
          |Metadata |Description |Field Size |Default values |
          |---------|------------|-----------|---------------|
          |`software_client_id`|The Client ID Registered at OB used to access OB resources|Base62 GUID (22 chars)| |
          |`software_client_description`|Human-readable detailed description of the client|Max256Text| |
          |`software_client_name`|Human-readable Software Name|Max40Text| |
          |`software_client_uri`|The website or resource root uri|Max256Text| |
          |`software_version`|The version number of the software should a TPP choose to register and / or maintain it|Max42Text| |
          |`software_environment`|Requested additional field to avoid certificate check|Max256Text| |
          |`software_jwks_endpoint`|Contains all active signing and network certs for the software|Max256Text| |
          |`software_jwks_revoked_endpoint`|Contains all revoked signing and network certs for the software|Max256Text| |
          |`software_logo_uri`|Link to the TPP logo. Note, ASPSPs are not obliged to display images hosted by third parties|Max256Text| |
          |`software_mode`|ASPSP Requested additional field to indicate that this software is `Test` or `Live` the default is `Live`. Impact and support for `Test` software is up to the ASPSP.|Max40Text| |
          |`software_on_behalf_of_org`|A reference to fourth party organsiation resource on the OB Directory if the registering TPP is acting on behalf of another.|Max40Text| |
          |`software_policy_uri`|A link to the software's policy page|Max256Text| |
          |`software_redirect_uris`|Registered client callback endpoints as registered with Open Banking|A string array of Max256Text items|
          |`software_roles`|A multi value list of PSD2 roles that this software is authorized to perform.|A string array of Max256Text items| |
          |`software_tos_uri`|A link to the software's terms of service page|Max256Text| |
          The following Organisational metadata is defined for this profile:
          |Metadata |Description |Field Size | Default values |
          |---------|------------|-----------|----------------|
          |`organisation_competent_authority_claims`|Authorisations granted to the organsiation by an NCA|CodeList {`AISP`, `PISP`, `CBPII`, `ASPSP`}| |
          |`org_status`|Included to cater for voluntary withdrawal from OB scenarios|`Active`, `Revoked`, or `Withdrawn`| |
          |`org_id`|The Unique TPP or ASPSP ID held by OpenBanking.|Max35Text| |
          |`org_name`|Legal Entity Identifier or other known organisation name|Max140Text| |
          |`org_contacts`|JSON array of objects containing a triplet of name, email, and phone number|Each item Max256Text| |
          |`org_jwks_endpoint`|Contains all active signing and network certs for the organisation|Max256Text| |
          |`org_jwks_revoked_endpoint`|Contains all revoked signing and network certs for the organisation|Max256Text| |
        ## SSA header
          The SSA header MUST comply with [RFC7519].
          |Metadata |Description |Comments |
          |---------|------------|---------|
          |`typ`|MUST be set to `JWT`| |
          |`alg`|MUST be set to `ES256` or `PS256`| |
          |`kid`|The kid will be kept the same as the `x5t` parameter. (X.509 Certificate SHA-1 Thumbprint) of the signing certificate.| |
          ### Example SSA
          The elements defined in the software statement will consist of the following values.
          *Note that there are inconsistent applications of booleans or "Active" strings in the current data model.*
          *Note that there are inconsistent applications of status flags case sensitivity.*
          *The attributes required to be displayed by ASPSPs.*
        ```
        {
          "typ": "JWT",
          "alg": "ES256",
          "kid": "ABCD1234"
        }
        {
          "iss": "OpenBanking Ltd",
          "iat": 1492756331,
          "jti": "id12345685439487678",
          "software_environment": "production",
          "software_mode": "live",
          "software_id": "65d1f27c-4aea-4549-9c21-60e495a7a86f",
          "software_client_id": "Open Banking TPP Client Unique ID",
          "software_client_name": "Amazon Prime Movies",
          "software_client_description": "Amazon Prime Movies is a movie streaming service",
          "software_version": "2.2.2",
          "software_client_uri": "https://prime.amazon.com",
          "software_redirect_uris": [
            "https://prime.amazon.com/cb",
            "https://prime.amazon.co.uk/cb"
          ],
          "software_roles": [
            "PISP",
            "AISP"
          ],
          "organisation_competent_authority_claims": {
            "authority_id": "FMA", // Austrian Financial Market Authority
            "registration_id": "111111",
            "status": "Active",
            "authorisations":  [
              {
                "member_state": "GB",
                "roles": [
                  "PISP",
                  "AISP"
                ]
              },
              {
                "member_state": "IR",
                "roles": [
                  "PISP"
                ]
              }
            ]
          },
          "software_logo_uri": "https://prime.amazon.com/logo.png",
          "org_status": "Active",
          "org_id": "Amazon TPPID",
          "org_name": "OpenBanking TPP Registered Name",
          "org_contacts": [
            {
              "name": "contact name",
              "email": "contact@contact.com",
              "phone": "+447890130558"
              "type": "business"
            },
            {
              "name": "contact name",
              "email": "contact@contact.com",
              "phone": "+447890130558",
              "type": "technical"
            }
          ],
          "org_jwks_endpoint": "https://jwks.openbanking.org.uk/org_id/org_id.jkws",
          "org_jwks_revoked_endpoint": "https://jwks.openbanking.org.uk/org_id/revoked/org_id.jkws",
          "software_jwks_endpoint": "https://jwks.openbanking.org.uk/org_id/software_id.jkws",
          "software_jwks_revoked_endpoint": "https://jwks.openbanking.org.uk/org_id/revoked/software_id.jkws",
          "software_policy_uri": "https://tpp.com/policy.html",
          "software_tos_uri": "https://tpp.com/tos.html",
          "software_on_behalf_of_org": "Acme Ltd"
        }
        {
          Signature
        }
        ```
        # Automated Client Registration
        A TPP MAY use automated client registration to submit an SSA to an ASPSP in exchange for client credentials for use as a client against an OAuth 2.0 Authorization Server. It is RECOMMENDED for ASPSPs to support the automated client registration mechanism. A large number of claims that OpenID Connect OPs could support as part of the RFC7591 request are detailed [https://openid.net/specs/openid-connect-registration-1_0.html#ClientMetadata](https://openid.net/specs/openid-connect-registration-1_0.html#ClientMetadata) and should be followed if not explicitly referenced in the Software Statement Assertion claim set.
        ## Request Validation
        Prior to issuing a client registration response, the ASPSP MUST perform the following checks
        * The ASPSP SHOULD check whether the TPP that initiated the TLS connection is the same TPP as listed in the SSA.
        * In the case where a gateway or other piece of infrastructure pre-terminates the MATLS channel in front of the registration endpoint, the certificate used to initiate the connection or some part of that certificate (such as DN & Issuer) SHOULD be made available to the ASPSP for validation against the claims in the SSA.
        * The registration request MUST be signed with a key contained in the JWKS referenced in the SSA included with the request. This ensures that a holder-of-key proof-of-possession is performed proving that the TPP app was the originally intended recipient of the SSA when the OB issued it.
        * The SSA MUST be validated according to [RFC7519], including validation of the signature and validity window.
        JWT signature must be validated, this involves retrieving the jwks keyset for both the OB and the TPP. The OB keystore location will be published as part of the directory specification, The TPP's will be included in the software statement.
        ### SSA Lifetime
        The SSA's Lifetime / Validity period is not defined by Open Banking. ASPSPs in the Open Banking ecosystem are required to implement pragmatic time ranges in which to accept an SSA. For example, an ASPSP that has implemented Dynamic Client Registration may choose to accept SSA's that were issued no earlier than 1 minute prior to their presentation however ASPSPs that only support manual registration may need to accept SSAs that were issued 30 minutes prior as the elapsed time period between generation and use between these two flows is expected to differ significantly.
      tags:
