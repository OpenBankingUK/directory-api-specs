          schema:
            $ref: '#/components/schemas/FapiInteractionIdSchema'
    401UnauthorizedResponse:
      description: Unauthorized
      headers:
        x-fapi-interaction-id:
          description: The `x-fapi-interaction-id` from the request, echoed unchanged, or a server-generated one
            if the request did not carry the header.
          schema:
            $ref: '#/components/schemas/FapiInteractionIdSchema'
    403ForbiddenResponse:
      description: Forbidden
      headers:
        x-fapi-interaction-id:
          description: The `x-fapi-interaction-id` from the request, echoed unchanged, or a server-generated one
            if the request did not carry the header.
          schema:
            $ref: '#/components/schemas/FapiInteractionIdSchema'
    404NotFoundResponse:
      description: Not found
      headers:
        x-fapi-interaction-id:
          description: The `x-fapi-interaction-id` from the request, echoed unchanged, or a server-generated one
            if the request did not carry the header.
          schema:
            $ref: '#/components/schemas/FapiInteractionIdSchema'
    406NotAcceptableResponse:
      description: Not Acceptable
