components:
  parameters:
    AuthorisationServerId:
      name: AuthorisationServerId
      description: The authorisation server Id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AuthorisationServerIdSchema'
    CertificateOrKeyId:
      name: CertificateOrKeyId
      description: The certificate or key Id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CertificateOrKeyIdSchema'
    ContactType:
      name: ContactType
      description: The contact type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContactTypeSchema'
    OrganisationCertificateType:
      name: OrganisationCertificateType
      description: The certificate type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrganisationCertificateTypeSchema'
    OrganisationAssociativeCertificateType:
      name: OrganisationAssociativeCertificateType
      description: The certificate type that can be associated with a software statement
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrganisationAssociativeCertificateTypeSchema'
    OrganisationId:
      name: OrganisationId
      description: The organsation ID
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrganisationIdSchema'
    SoftwareStatementCertificateOrKeyType:
      name: SoftwareStatementCertificateOrKeyType
      description: The certificate or key type that can be associated with a software statement
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SoftwareStatementCertificateOrKeyTypeSchema'
    SoftwareStatementId:
      name: SoftwareStatementId
      description: The software statement ID
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SoftwareStatementIdSchema'
    NCAFirmId:
      name: NCAFirmId
      description: Entity's ID assigned by the National Competent Authority
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NCAFirmIdSchema'
    NCAId:
      name: NCAId
      description: National Competent Authority ID (nca_etsi_code)
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NCAIdSchema'
    FapiInteractionId:
      name: x-fapi-interaction-id
      description: 'An RFC 4122 UUID used to correlate the request with its response. Optional: supply one to tie
        the call to your own logs and it is echoed back unchanged; omit it and the server generates one. Either
        way the response carries the header.'
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/FapiInteractionIdSchema'
  requestBodies:
    CertificateOrCSROrJWS:
      description: |-
        * __PEM file__ -- the request `Content-Type` header must be `application/x-pem-file`. The contents of the PEM file differ depending upon `OrganisationCertificateType`. If `OrganisationCertificateType` is set to `qwac` or `qseal` then the PEM file should contain a *QWAC* or a *QSEAL* certificate respectively; if `OrganisationCertificateType` is set to `obwac` or `obseal` then the PEM file should contain a Certificate Signing Request (CSR) for an OB-issued *OBWAC* or *OBSEAL* certificate respectively.

        **`application/jwt` is not accepted.** The legacy directory additionally accepted a signed JWT carrying the CSR in a `csr` claim, or the certificate chain in an `x5c` claim, as an alternative to a PEM body. That form is not served on this layer. Submit the certificate or CSR as PEM; a request presenting `Content-Type: application/jwt` is rejected.
      required: true
      content:
        application/x-pem-file:
          schema:
            $ref: '#/components/schemas/CertificateOrKeyOrJWTSchema'
    CSROrKey:
      description: PEM file -- the contents of the PEM file will differ depending upon *SoftwareStatementCertificateOrKeyType*.
        If *SoftwareStatementCertificateOrKeyType* is set to *obsigning* or *obtransport* then the PEM file should
        contain a Certificate Signing Request (CSR) for an OB signing or OB transport certificate respectively;
        if *SoftwareStatementCertificateOrKeyType* is set to *sigkey*, *enckey* then the PEM file should contain
        a public signing or encryption key respectively.
      required: true
      content:
        application/x-pem-file:
          schema:
            $ref: '#/components/schemas/CertificateOrKeyOrJWTSchema'
    CertificateOrKeyAssociation:
      description: Certificate or Key Association Payload
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CertificateOrKeyAssociationSchema'
    CertificateValidationRequestBody:
      description: Certificate Validation Payload
      required: true
      content:
        application/x-pem-file:
          schema:
            $ref: '#/components/schemas/CertificateValidationSchema'
    SoftwareStatement:
      description: Software Statement payload
      required: true
      content:
        application/vnd.openbanking.directory.softwarestatement-v2+json:
          schema:
            $ref: '#/components/schemas/SoftwareStatementCreateSchema'
    SoftwareStatementRedirectURI:
      description: Redirect Uri's for the registered piece of software. May be overridden by the RFC7591 payload.
        This field is searchable and is not included as part of the response payload when unassigned.
      required: true
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/SoftwareStatementRedirectURISchema'
    SoftwareStatementState:
      description: Payload used to deactivate/reactivate a Software Statement
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SoftwareStatementStateSchema'
  responses:
    204NoContentResponse:
      description: No Content
      headers:
        x-fapi-interaction-id:
          description: The `x-fapi-interaction-id` from the request, echoed unchanged, or a server-generated one
            if the request did not carry the header.
          schema:
            $ref: '#/components/schemas/FapiInteractionIdSchema'
    400BadRequestResponse:
      description: Bad Request
      headers:
        x-fapi-interaction-id:
          description: The `x-fapi-interaction-id` from the request, echoed unchanged, or a server-generated one
